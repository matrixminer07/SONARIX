<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SONARIX — Access Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sx-abyss:#040a12;
    --sx-deep:#081826;
    --sx-panel:#0b1f30;
    --sx-field:#0d2434;
    --sx-teal:#2dd4bf;
    --sx-teal-dim:#1d9e88;
    --sx-cyan:#67e8f9;
    --sx-amber:#f0b429;
    --sx-text:#e7f2f4;
    --sx-muted:#7d97a8;
    --sx-muted-dim:#4d6373;
    --sx-border:rgba(45,212,191,0.16);
    --sx-border-strong:rgba(45,212,191,0.32);
    --sx-danger:#e8615a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse 120% 90% at 50% -10%, #0c2436 0%, var(--sx-abyss) 55%),
      var(--sx-abyss);
    color:var(--sx-text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* bathymetric grid */
  .grid-overlay{
    position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(103,232,249,0.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(103,232,249,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 75% 65% at 50% 50%, black 20%, transparent 75%);
    pointer-events:none;
  }

  /* depth ticks, left + right edges */
  .depth-rail{
    position:absolute; top:0; bottom:0; width:64px;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:40px 0; pointer-events:none;
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.5px;
    color:var(--sx-muted-dim);
  }
  .depth-rail.left{left:18px;}
  .depth-rail.right{right:18px; text-align:right;}
  .depth-rail span{opacity:0.75; position:relative;}
  .depth-rail span::before{
    content:''; position:absolute; top:50%; width:10px; height:1px; background:var(--sx-muted-dim); opacity:0.5;
  }
  .depth-rail.left span::before{left:-16px;}
  .depth-rail.right span::before{right:-16px;}

  /* sonar sweep, ambient, behind the card */
  .sonar-wrap{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:900px; height:900px;
    pointer-events:none;
    opacity:0.55;
  }
  .sonar-wrap svg{width:100%; height:100%; display:block;}
  .ring{ fill:none; stroke:var(--sx-teal); }
  .sweep-beam{ transform-origin:450px 450px; animation:rotate 6s linear infinite; }
  @keyframes rotate{ to{ transform:rotate(360deg); } }

  .blip{ animation: blip-pulse 3.4s ease-in-out infinite; }
  @keyframes blip-pulse{
    0%,100%{ opacity:0; }
    8%{ opacity:1; }
    28%{ opacity:0.15; }
    45%{ opacity:0.85; }
    100%{ opacity:0; }
  }

  /* card */
  .stage{ position:relative; z-index:2; width:100%; max-width:404px; padding:0 20px; }

  .brand{ text-align:center; margin-bottom:34px; }
  .brand-mark{
    display:inline-flex; align-items:center; gap:10px; justify-content:center;
  }
  .brand-mark svg{ width:26px; height:26px; flex-shrink:0; }
  .brand-name{
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:24px;
    letter-spacing:4px; color:var(--sx-text);
  }
  .brand-name em{ font-style:normal; color:var(--sx-teal); }
  .brand-sub{
    margin-top:9px; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    letter-spacing:1.6px; color:var(--sx-muted); text-transform:uppercase;
  }

  .status-line{
    display:flex; align-items:center; justify-content:center; gap:7px;
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    letter-spacing:1px; color:var(--sx-teal-dim); text-transform:uppercase;
  }
  .status-dot{
    width:6px; height:6px; border-radius:50%; background:var(--sx-teal);
    box-shadow:0 0 6px 1px var(--sx-teal);
    animation:dot-pulse 2s ease-in-out infinite;
  }
  @keyframes dot-pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .panel{
    background: linear-gradient(180deg, var(--sx-panel) 0%, var(--sx-deep) 100%);
    border:1px solid var(--sx-border);
    border-radius:3px;
    padding:32px 30px 28px;
    position:relative;
  }
  .panel::before{
    content:''; position:absolute; top:-1px; left:-1px; right:-1px; height:2px;
    background:linear-gradient(90deg, transparent, var(--sx-teal), transparent);
    opacity:0.7;
  }
  .corner{ position:absolute; width:14px; height:14px; border:1px solid var(--sx-border-strong); }
  .corner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .corner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
  .corner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
  .corner.br{ bottom:8px; right:8px; border-left:none; border-top:none; }

  .field{ margin-bottom:19px; }
  .field label{
    display:block; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    letter-spacing:1.6px; text-transform:uppercase; color:var(--sx-muted);
    margin-bottom:8px;
  }
  .input-wrap{ position:relative; }
  .input-wrap input{
    width:100%; background:var(--sx-field); border:1px solid var(--sx-border);
    border-radius:2px; padding:12px 40px 12px 13px; color:var(--sx-text);
    font-family:'Inter',sans-serif; font-size:14px; outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap input::placeholder{ color:var(--sx-muted-dim); }
  .input-wrap input:focus{
    border-color:var(--sx-teal); box-shadow:0 0 0 3px rgba(45,212,191,0.12);
  }
  .input-wrap .icon{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; color:var(--sx-muted-dim); pointer-events:none;
  }
  .input-wrap input:focus ~ .icon{ color:var(--sx-teal); }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin:2px 0 22px;
  }
  .remember{ display:flex; align-items:center; gap:8px; }
  .remember input{ accent-color:var(--sx-teal); width:14px; height:14px; }
  .remember span{ font-size:12.5px; color:var(--sx-muted); }
  .forgot{
    font-size:12.5px; color:var(--sx-teal-dim); text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .forgot:hover{ color:var(--sx-teal); border-bottom-color:var(--sx-teal); }

  .btn-dive{
    width:100%; padding:12.5px; border:1px solid var(--sx-teal);
    background:rgba(45,212,191,0.08); color:var(--sx-teal);
    font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:2px;
    text-transform:uppercase; border-radius:2px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:9px;
    transition:background .15s ease, color .15s ease;
  }
  .btn-dive:hover{ background:var(--sx-teal); color:var(--sx-deep); }
  .btn-dive svg{ width:14px; height:14px; }

  .divider{
    display:flex; align-items:center; gap:12px; margin:22px 0 18px;
    color:var(--sx-muted-dim); font-family:'JetBrains Mono',monospace; font-size:10px;
    letter-spacing:1.5px; text-transform:uppercase;
  }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--sx-border); }

  .footer-link{
    text-align:center; font-size:12.5px; color:var(--sx-muted); margin-top:6px;
  }
  .footer-link a{ color:var(--sx-teal-dim); text-decoration:none; }
  .footer-link a:hover{ color:var(--sx-teal); }

  .below-card{
    text-align:center; margin-top:22px; font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:1.2px; color:var(--sx-muted-dim); text-transform:uppercase;
  }

  @media (max-width:480px){
    .depth-rail{ display:none; }
    .sonar-wrap{ width:680px; height:680px; opacity:0.4; }
    .panel{ padding:26px 20px 24px; }
  }
</style>
</head>
<body>

  <div class="grid-overlay"></div>

  <div class="depth-rail left">
    <span>0M</span><span>250M</span><span>500M</span><span>750M</span><span>1000M</span>
  </div>
  <div class="depth-rail right">
    <span>N 12°04'</span><span>W 61°37'</span><span>SCAN 04</span><span>RNG 500M</span><span>ARRAY OK</span>
  </div>

  <div class="sonar-wrap" aria-hidden="true">
    <svg viewBox="0 0 900 900">
      <circle class="ring" cx="450" cy="450" r="120" stroke-width="1" opacity="0.35"/>
      <circle class="ring" cx="450" cy="450" r="220" stroke-width="1" opacity="0.28"/>
      <circle class="ring" cx="450" cy="450" r="320" stroke-width="1" opacity="0.20"/>
      <circle class="ring" cx="450" cy="450" r="420" stroke-width="1" opacity="0.12"/>
      <g class="sweep-beam">
        <defs>
          <linearGradient id="sweepGrad" x1="450" y1="450" x2="900" y2="450" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
          </linearGradient>
          <clipPath id="sweepClip"><circle cx="450" cy="450" r="420"/></clipPath>
        </defs>
        <g clip-path="url(#sweepClip)">
          <path d="M450,450 L450,30 A420,420 0 0,1 597,79 Z" fill="url(#sweepGrad)"/>
        </g>
        <line x1="450" y1="450" x2="450" y2="30" stroke="#67e8f9" stroke-width="1.5" opacity="0.8"/>
      </g>
      <circle class="blip" cx="610" cy="340" r="4" fill="#f0b429" style="animation-delay:0.2s"/>
      <circle class="blip" cx="320" cy="560" r="3.5" fill="#2dd4bf" style="animation-delay:1.6s"/>
      <circle class="blip" cx="560" cy="600" r="3" fill="#67e8f9" style="animation-delay:2.8s"/>
      <circle class="blip" cx="290" cy="330" r="3" fill="#2dd4bf" style="animation-delay:4s"/>
    </svg>
  </div>

  <div class="stage">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10.5" stroke="#2dd4bf" stroke-width="1.2" opacity="0.5"/>
          <circle cx="12" cy="12" r="6.5" stroke="#2dd4bf" stroke-width="1.2" opacity="0.75"/>
          <circle cx="12" cy="12" r="1.8" fill="#67e8f9"/>
          <line x1="12" y1="12" x2="12" y2="2" stroke="#67e8f9" stroke-width="1.2"/>
        </svg>
        <span class="brand-name">SONAR<em>IX</em></span>
      </div>
      <div class="brand-sub">Sonar Navigation &amp; Recovery Intelligence eXplorer</div>
      <div class="status-line"><span class="status-dot"></span>Array online — awaiting operator</div>
    </div>

    <div class="panel">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>

      <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <div class="input-wrap">
          <input id="email" type="email" placeholder="you@fleet.org" autocomplete="username" required />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6l9 6 9-6M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" type="password" placeholder="••••••••••" autocomplete="current-password" required />
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="10.5" width="15" height="9.5" rx="1.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        </div>
      </div>

      <div class="row-between">
        <label class="remember"><input type="checkbox" /><span>Remember this device</span></label>
        <a class="forgot" href="#">Forgot password?</a>
      </div>

      <button class="btn-dive" type="submit">
        Access console
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="divider">Or</div>

      <div class="footer-link">Cleared for a new fleet? <a href="#">Request access</a></div>
      </form>

    <div class="below-card">SONARIX v2.4 — Secure oceanic uplink</div>
  </div>

  <script>
    // Mock credentials
    const VALID_EMAIL = 'you@fleet.org';
    const VALID_PASSWORD = '123456';

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rememberDevice = document.querySelector('.remember input').checked;

      // Validate credentials
      if (email === VALID_EMAIL && password === VALID_PASSWORD) {
        // Store login state
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
        if (rememberDevice) {
          localStorage.setItem('rememberDevice', 'true');
        }
        
        // Show success message
        alert('✓ Array synchronized - Access granted');
        
        // Redirect to dashboard
        window.location.href = '/?page=dashboard';
      } else {
        alert('⚠ Invalid credentials. Try:\nEmail: you@fleet.org\nPassword: 123456');
      }
    });
  </script>

</body>
</html>
